# Core workstation bundle: bootstraps Homebrew (macOS), updates the system,
# clones dotfiles, then sets up zsh (+fastfetch), nvim (+config_dir), and
# ranger (+config_dir) via role deps.
- name: Set up workstation
  hosts: all
  roles:
#    - homebrew TODO fix
    - system_update
    - dotfiles
    - zsh
    - nvim
    - ranger
