# Core workstation bundle: updates the system, clones dotfiles, then sets up
# git, zsh (+fastfetch), nvim (+config_dir), ranger (+config_dir),
# zellij (+config_dir), alacritty (+config_dir) via role deps, WiFiLocControl (macOS only), and
# finally cleanup (uninstalls software this repo no longer installs).
# Homebrew itself is installed by ansible/bootstrap.sh, not by this playbook.
- name: Set up workstation
  hosts: all
  vars_prompt:
    - name: git_user_name
      prompt: "Enter your Git user name (leave blank to keep existing)"
      private: no
      default: ""
    - name: git_user_email
      prompt: "Enter your Git user email (leave blank to keep existing)"
      private: no
      default: ""
  roles:
    - system_update
    - dotfiles
    - git
    - zsh
    - nvim
    - ranger
    - zellij
    - wifi_loc_control
    - cleanup
