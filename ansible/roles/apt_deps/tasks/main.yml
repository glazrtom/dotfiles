# python3-debian is required on the target by the deb822_repository module.
- name: Ensure python3-debian (needed by deb822_repository)
  become: true
  ansible.builtin.apt:
    name: python3-debian
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: os_debian

- name: Remove legacy apt repository files
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ apt_deps_legacy_files }}"
  register: apt_deps_legacy_removed
  when: os_debian

- name: Find other apt source files for legacy repositories
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d
    patterns: ["*.list", "*.sources"]
    contains: "{{ item.regex }}"
    excludes: "{{ item.keep }}"
  loop: "{{ apt_deps_legacy_sources }}"
  register: apt_deps_legacy_found
  when: os_debian

- name: Remove other apt source files for legacy repositories
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ apt_deps_legacy_found.results | map(attribute='files') | flatten | map(attribute='path') }}"
  register: apt_deps_legacy_found_removed
  when: os_debian

# A role's deb822 file may already be in place from an earlier, failed run, so
# it won't report changed and won't refresh the cache itself.
- name: Update apt cache after removing legacy sources
  become: true
  ansible.builtin.apt:
    update_cache: true
  when:
    - os_debian
    - apt_deps_legacy_removed is changed or apt_deps_legacy_found_removed is changed
