#################################################################
# Install Hack Nerd Font (required by alacritty and ghostty configs)
#################################################################

- name: Install Hack Nerd Font on macOS
  community.general.homebrew_cask:
    name: font-hack-nerd-font
    state: present
  when: os_macos

- name: Install Hack Nerd Font on Arch Linux
  become: true
  community.general.pacman:
    name: ttf-hack-nerd
    state: present
  when: os_archlinux

# Debian/Ubuntu ship no Hack Nerd Font package, so fetch the release directly.
- name: Install Hack Nerd Font on Debian/Ubuntu
  when: os_debian
  block:
    - name: Ensure user fonts directory exists
      file:
        path: "{{ path_fonts }}"
        state: directory
        mode: '0755'

    - name: Download and extract Hack Nerd Font
      ansible.builtin.unarchive:
        src: "{{ nerd_font_url }}"
        dest: "{{ path_fonts }}"
        remote_src: yes
        creates: "{{ path_fonts }}/HackNerdFont-Regular.ttf"
      register: hack_nerd_font

    - name: Refresh font cache
      ansible.builtin.command: fc-cache -f
      when: hack_nerd_font.changed
      changed_when: true
