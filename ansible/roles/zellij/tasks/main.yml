#################################################################
# macOS INSTALLATION (Homebrew)
#################################################################

- name: Install zellij on macOS
  community.general.homebrew:
    name: zellij
    state: present
  when: os_macos

#################################################################
# Arch Linux INSTALLATION (pacman)
#################################################################

- name: Install zellij on Arch Linux
  become: true
  community.general.pacman:
    name: zellij
    state: present
  when: os_archlinux

#################################################################
# Debian/Ubuntu: apt when the distro ships zellij, else release tarball
#################################################################

- name: Look for a zellij apt candidate
  ansible.builtin.command: apt-cache policy zellij
  register: zellij_apt_policy
  changed_when: false
  check_mode: false
  when: os_debian

- name: Install zellij via apt
  become: true
  ansible.builtin.apt:
    name: zellij
    state: present
  when:
    - os_debian
    - zellij_apt_candidate

# Used when apt has no candidate (older Debian/Ubuntu) and on other Linux distros.
- name: Ensure ~/.local/bin exists
  ansible.builtin.file:
    path: "{{ path_local }}/bin"
    state: directory
    mode: '0755'
  when: zellij_use_tarball

- name: Install zellij via direct download
  ansible.builtin.unarchive:
    src: "{{ zellij_url }}"
    dest: "{{ path_local }}/bin"
    remote_src: yes
    include: [zellij]
    mode: '0755'
    creates: "{{ path_local }}/bin/zellij"
  when: zellij_use_tarball

#################################################################
# Config
#################################################################

- name: Link zellij config
  file:
    src: "{{ path_dotfiles }}/zellij"
    dest: "{{ path_config_zellij }}"
    state: link
    force: yes
