#################################################################
# Install Ghostty (macOS only — no Linux package wired up here yet)
#################################################################

- name: Install Ghostty on macOS
  community.general.homebrew_cask:
    name: ghostty
    state: present
  when: os_macos

#################################################################
# Config
#################################################################

- name: Link ghostty config
  file:
    src: "{{ path_dotfiles }}/ghostty"
    dest: "{{ path_config_ghostty }}"
    state: link
    force: yes
