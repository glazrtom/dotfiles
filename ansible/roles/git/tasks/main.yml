# macOS gets git from the Xcode Command Line Tools (/usr/bin/git).
- name: Ensure git is installed (Linux)
  become: true
  package:
    name: git
    state: present
  when: os_linux

# Include rather than copy: ~/.gitconfig stays machine-owned, so user.name/email
# and anything set by other tools (e.g. gh credential helpers) survive re-runs.
- name: Include dotfiles git config
  community.general.git_config:
    name: include.path
    scope: global
    value: "{{ path_dotfiles }}/.gitconfig"

- name: Configure git user name
  community.general.git_config:
    name: user.name
    scope: global
    value: "{{ git_user_name }}"
  when: git_user_name | default('') | length > 0

- name: Configure git user email
  community.general.git_config:
    name: user.email
    scope: global
    value: "{{ git_user_email }}"
  when: git_user_email | default('') | length > 0
