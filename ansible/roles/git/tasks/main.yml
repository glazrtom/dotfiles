# macOS gets git from the Xcode Command Line Tools (/usr/bin/git).
- name: Ensure git is installed (Linux)
  become: true
  package:
    name: git
    state: present
  when: os_linux

- name: Copy git config
  copy:
    src: "{{ path_dotfiles }}/.gitconfig"
    dest: "{{ path_home }}/.gitconfig"
    owner: "{{ ansible_facts.user_id }}"
    mode: '0644'
    remote_src: true

- name: Configure git user name
  community.general.git_config:
    name: user.name
    scope: global
    value: "{{ git_user_name }}"
  when: git_user_name | default('') | length > 0

- name: Configure git user email
  community.general.git_config:
    name: user.email
    scope: global
    value: "{{ git_user_email }}"
  when: git_user_email | default('') | length > 0
