- name: Add Fastfetch PPA (Ubuntu 22.04–24.10)
  become: true
  block:
    - name: Add Fastfetch PPA
      deb822_repository:
        name: fastfetch
        types: deb
        uris: https://ppa.launchpadcontent.net/zhangsongcui3371/fastfetch/ubuntu
        suites: "{{ ansible_facts.distribution_release }}"
        components: main
        signed_by: https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xEB65EE19D802F3EB1A13CFE47E2E5CB4D4865F21
        state: present
      register: fastfetch_ppa

    - name: Update apt cache after adding PPA
      apt:
        update_cache: yes
      when: fastfetch_ppa.changed
  when:
    - ansible_facts.distribution == "Ubuntu"
    - ansible_facts.distribution_version is version("22.04", ">=")
    - ansible_facts.distribution_version is version("24.10", "<")

- name: Install Fastfetch via package manager
  become: "{{ os_linux }}"
  package:
    name: fastfetch
    state: present
